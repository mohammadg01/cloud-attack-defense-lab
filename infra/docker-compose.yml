services:
  imds-mock:
    build: ../imds-mock
    networks:
      labnet:
        ipv4_address: 169.254.169.254

  webapp:
    build: ../webapp
    ports:
      - "5000:5000"
    volumes:
      - /var/log/webapp:/var/log/webapp
    networks:
      - labnet
    depends_on:
      - imds-mock
      - azurite

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite-blob --blobHost 0.0.0.0"
    ports:
      - "10000:10000"
    networks:
      - labnet

networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 169.254.169.0/24
