services:
  # Dienst 1: Metadaten-Dienst, bekommt die feste IMDS-Adresse.
  imds-mock:
    build: ../imds-mock
    networks:
      labnet:
        ipv4_address: 169.254.169.254

  # Dienst 2: verwundbare Web-App, von aussen auf Port 5000 erreichbar.
  webapp:
    build: ../webapp
    ports:
      - "5000:5000"
    networks:
      - labnet
    depends_on:
      - imds-mock
      - azurite

  # Dienst 3: Azure-Storage-Emulator (fertiges Image), Blob-Port 10000.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite-blob --blobHost 0.0.0.0"
    ports:
      - "10000:10000"
    networks:
      - labnet

# Eigenes Netz mit einem Subnetz, das die echte IMDS-Adresse enthaelt.
networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 169.254.169.0/24
